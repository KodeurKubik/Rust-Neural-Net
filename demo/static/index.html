<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NeuralNet Playground</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f0f13;
        --surface: #1a1a24;
        --surface2: #22222f;
        --border: #2e2e40;
        --accent: #7c6af7;
        --accent2: #a78bfa;
        --text: #e8e8f0;
        --muted: #6b6b80;
        --sidebar-w: 220px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
      }

      /* ── Sidebar ── */
      nav {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1rem;
        gap: 2rem;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .nav-brand {
        padding: 0 0.5rem;
      }
      .nav-brand h2 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-brand p {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .nav-section {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .nav-label {
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        padding: 0 0.5rem;
        margin-bottom: 0.25rem;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        text-decoration: none;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.15s;
      }
      .nav-link:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .nav-link.active {
        color: var(--accent2);
        background: rgba(124, 106, 247, 0.12);
      }
      .nav-link .icon {
        font-size: 1rem;
        width: 1.2rem;
        text-align: center;
      }

      /* ── Main ── */
      main {
        flex: 1;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2.5rem;
        max-width: 860px;
      }

      .page-header h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .page-header p {
        color: var(--muted);
        margin-top: 0.4rem;
        font-size: 0.9rem;
      }

      /* ── Project cards grid ── */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
        width: 100%;
      }

      .card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1.25rem 1rem;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        transition: all 0.15s;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(124, 106, 247, 0.15);
      }

      .card-icon {
        font-size: 1.75rem;
      }
      .card-title {
        font-size: 0.95rem;
        font-weight: 700;
      }
      .card-desc {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .card-tag {
        align-self: flex-start;
        font-size: 0.65rem;
        font-weight: 600;
        padding: 0.2rem 0.5rem;
        border-radius: 99px;
        background: rgba(124, 106, 247, 0.12);
        color: var(--accent2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-brand">
        <h2>NeuralNet Playground</h2>
        <p>Kubik's models</p>
      </div>
      <div class="nav-section">
        <span class="nav-label">Pages</span>
        <a href="index.html" class="nav-link active">
          <span class="icon">⌂</span> Home
        </a>
      </div>
      <div class="nav-section">
        <span class="nav-label">Projects</span>
        <a href="mnist.html" class="nav-link">
          <span class="icon">✏</span> MNIST
        </a>
        <!-- Add more project links here -->
      </div>
    </nav>

    <main>
      <div class="page-header">
        <h1>NeuralNet Playground</h1>
        <p>Interactive demos for models I trained in Rust with my own lib :p</p>
      </div>

      <div class="cards">
        <a href="mnist.html" class="card">
          <span class="card-icon">✏️</span>
          <span class="card-title">MNIST Classifier</span>
          <p class="card-desc">
            Draw a digit and see what a hand-rolled neural net thinks it is!
          </p>
          <span class="card-tag">Classification</span>
        </a>
        <!-- Future cards go here -->
      </div>
    </main>
  </body>
</html>
