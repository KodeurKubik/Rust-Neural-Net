[workspace]
members = [
  "mnist",
  "newsclassifier"
]
resolver = "3"

[package]
name = "neuralnet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
parquet = "57"
bincode = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"
rand = "0.10"
rand_distr = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
